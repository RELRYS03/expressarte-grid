name: Publicar Expressarte na Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar banco D1
        run: node cloudflare/provision.mjs
      - name: Criar tabelas
        run: npx --yes wrangler@4 d1 execute expressarte-grid --remote --file=cloudflare/schema.sql
      - name: Configurar senhas dos dois administradores
        env:
          HASH_RELRYSALVES: ${{ secrets.ADMIN_HASH_RELRYSALVES }}
          HASH_RELRYS17: ${{ secrets.ADMIN_HASH_RELRYS17 }}
        run: |
          test -n "$HASH_RELRYSALVES" && test -n "$HASH_RELRYS17"
          printf '%s' "$HASH_RELRYSALVES" | npx --yes wrangler@4 secret put ADMIN_HASH_RELRYSALVES
          printf '%s' "$HASH_RELRYS17" | npx --yes wrangler@4 secret put ADMIN_HASH_RELRYS17
      - name: Publicar site e API
        run: npx --yes wrangler@4 deploy
